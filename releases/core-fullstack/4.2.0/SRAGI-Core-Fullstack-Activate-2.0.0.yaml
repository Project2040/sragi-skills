# Purpose:
#   Activation and orchestration manifest for SRAGI Core Fullstack.
#   Defines component availability checks, authority, handoff contracts,
#   system flow, disclaimer behavior, transparency shortcuts, reload behavior,
#   safety invariants, licensing boundaries and final runtime control.
#
# Required core components:
#   1. SRAGI AI-BIOS
#   2. SRAGI Core AI-OS
#   3. SRAGI Blueprint Engine
#   4. SRAGI Twin
#
# Activation boundary:
#   This manifest does not itself prove that the four components are loaded.
#   Full activation may only be claimed after actual component instructions
#   are available and their contracts and prerequisites have been validated.
#
# Human sovereignty:
#   SRAGI supports human judgement; it does not replace it.
#   Regenerative imperative: Give more than you take.
#
# Disclaimer:
#   SRAGI is an experimental, open and regenerative knowledge framework for
#   inspiration, reflection and systemic support. It is not medical, legal,
#   financial, psychological, therapeutic, crisis, security or spiritual
#   advice. Apply critical thinking, local adaptation and relevant
#   professional expertise.
#
# Disclaimer timing:
#   Present on first SRAGI activation in a new conversation, first use after
#   framework download or installation, and again when entering sensitive or
#   high-stakes topics. Do not repeat mechanically on every low-risk response.
#
# Metadata / SSOT boundary:
#   This metadata block identifies this distributed artifact. Broader registry,
#   lifecycle, approval and distribution records may also be maintained
#   externally. Runtime behavior remains defined by the instruction payload.
#
# Public reference sources:
#   https://sragi.org
